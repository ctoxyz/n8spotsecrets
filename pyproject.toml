[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "n8spotsecrets"
version = "0.1.0"
description = "Ask the address, not the listing: an address report for renters from free public data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["open-data", "real-estate", "rentals", "los-angeles", "civic-tech"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ctoxyz/n8spotsecrets"
Live = "https://n8dog.com/rentals/"

[project.scripts]
n8spotsecrets = "n8spotsecrets.cli:main"

[tool.setuptools]
packages = ["n8spotsecrets", "n8spotsecrets.sources"]
