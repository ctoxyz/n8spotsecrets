name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: syntax
        run: python -m compileall -q n8spotsecrets tests
      - name: tests (offline, no keys)
        run: python -m unittest discover -s tests -v
      - name: no secrets in the tree
        run: |
          ! grep -rEn "AKIA[0-9A-Z]{16}|sk_live_|-----BEGIN [A-Z ]*PRIVATE KEY" --exclude-dir=.git --exclude-dir=.github .
